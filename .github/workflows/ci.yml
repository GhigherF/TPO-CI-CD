name: CI

on:
  push:
    branches:
      - main
      - dev
      - fix
  pull_request:
    branches:
      - main
      - dev

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local web server
        run: npx http-server public -p 3000 &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Selenium UI tests
        run: npm test
