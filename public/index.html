<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма обратной связи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 id="page-title">Форма обратной связи</h1>
      <p class="subtitle">Заполните поля ниже, чтобы отправить сообщение.</p>

      <form id="feedback-form">
        <label for="name">Имя</label>
        <input id="name" name="name" type="text" placeholder="Введите имя" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Введите email" required>

        <label for="message">Сообщение</label>
        <textarea id="message" name="message" placeholder="Введите сообщение" required></textarea>

        <button id="submit-button" type="submit">Отправить</button>
      </form>

      <p id="result" class="result" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
